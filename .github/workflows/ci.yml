name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      G0_DB_PATH: ${{ runner.temp }}/layer.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Eval report (recorded fixtures)
        run: uv run post-loop eval --out ${{ runner.temp }}/out --report ${{ runner.temp }}/eval-report.md
